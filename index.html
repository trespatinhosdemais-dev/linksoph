<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Links da Sophia Laura: portfólio, Pergunta sobre fé e LinkedIn.">
<title>Links da Soph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única centrada; selo com iniciais, nome grande, chips do que ela faz, dois links como adesivos tortos; luzes roxas suaves se movendo pelo fundo todo */
:root{
  --bg:#EEEAF4; --surface:#FAF8FD; --ink:#221B2E; --muted:#665D75;
  --accent:#5B2A86; --accent-ink:#FFFFFF; --gold:#A8792A; --gold-soft:#F3E3BF; --line:#D6CDE2;
  --float:rgba(91,42,134,.10);
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17131D; --surface:#221C2B; --ink:#EEEAF4; --muted:#A89EB7;
    --accent:#B58BE3; --accent-ink:#1A1024; --gold:#D9AE57; --gold-soft:#3A2F1C; --line:#3A3147;
    --float:rgba(181,139,227,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17131D; --surface:#221C2B; --ink:#EEEAF4; --muted:#A89EB7;
  --accent:#B58BE3; --accent-ink:#1A1024; --gold:#D9AE57; --gold-soft:#3A2F1C; --line:#3A3147;
  --float:rgba(181,139,227,.10);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:1.0625rem; line-height:1.5;
  display:flex; flex-direction:column; align-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overflow-x:hidden; position:relative;
}

/* Formas flutuando ao fundo */
.sky{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.sky{background:
    radial-gradient(40% 45% at 20% 15%, rgba(180,143,224,.14), transparent 70%),
    radial-gradient(35% 40% at 85% 85%, rgba(142,79,209,.11), transparent 70%),
    radial-gradient(45% 40% at 80% 20%, rgba(122,63,192,.10), transparent 70%),
    radial-gradient(40% 45% at 15% 85%, rgba(110,80,210,.10), transparent 70%)}
.light{position:absolute; left:0; top:0; filter:blur(64px); will-change:transform;
  transition-property:transform, border-radius, opacity;
  transition-timing-function:cubic-bezier(.45,0,.55,1)}

main{
  position:relative; z-index:1; width:100%; max-width:30rem; flex:1;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding-block:3rem 1.5rem; gap:2.25rem;
}

/* Cabeçalho */
header{display:flex; flex-direction:column; align-items:center; gap:.9rem}
.badge{
  width:7.5rem; height:7.5rem; border-radius:50%; overflow:hidden;
  background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-family:var(--serif); font-size:2.4rem; line-height:1; letter-spacing:-.02em;
  box-shadow:0 0 0 6px var(--bg), 0 0 0 8px var(--gold);
  animation:wiggle 4.5s ease-in-out infinite; transform-origin:50% 70%;
  border:0; padding:0; margin-bottom:.4rem;
}
@keyframes wiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-10deg)}90%{transform:rotate(8deg)}94%{transform:rotate(-4deg)}}
.badge img{width:100%; height:100%; object-fit:cover; display:block}
.badge:focus-visible{outline:3px solid var(--gold); outline-offset:10px}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(2.5rem,10vw,3.4rem); line-height:1; margin:0; letter-spacing:-.01em; text-wrap:balance}
h1 em{font-style:normal; color:var(--accent); display:inline-block; animation:pop 2.6s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:none}78%{transform:translateY(-6px) rotate(10deg)}86%{transform:none}}
.role{
  display:inline-block; font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--gold); background:var(--gold-soft); padding:.3rem .8rem; border-radius:999px;
}
.lead{margin:0; color:var(--muted); max-width:23rem; text-wrap:balance}
.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem; margin:0; padding:0; list-style:none}
.chips li{
  font-size:.85rem; font-weight:500; padding:.3rem .75rem; border-radius:999px;
  border:1.5px solid var(--line); background:var(--surface);
}
.chips li:nth-child(odd){transform:rotate(-2deg)}
.chips li:nth-child(even){transform:rotate(2deg)}

/* Links como adesivos */
nav{width:100%; display:flex; flex-direction:column; gap:1.4rem}
.sticker{
  --tilt:-1.6deg; position:relative;
  display:flex; align-items:center; gap:1rem; text-align:left;
  padding:1.1rem 1.25rem; border-radius:1.4rem; text-decoration:none;
  border:2px solid var(--ink); background:var(--surface); color:var(--ink);
  box-shadow:5px 6px 0 var(--ink);
  transform:rotate(var(--tilt));
  transition:transform .18s cubic-bezier(.2,.8,.2,1.3), box-shadow .18s ease;
}
.sticker:nth-child(2){--tilt:1.4deg}
.sticker:hover{transform:rotate(0) translate(-2px,-3px); box-shadow:8px 9px 0 var(--ink)}
.sticker:active{transform:rotate(0) translate(3px,4px); box-shadow:1px 2px 0 var(--ink)}
.sticker:focus-visible{outline:3px solid var(--gold); outline-offset:5px}
.sticker.primary{background:var(--accent); color:var(--accent-ink)}
.icon{
  flex:none; width:3.2rem; height:3.2rem; border-radius:1rem;
  display:grid; place-items:center; font-family:var(--serif); font-size:1.9rem; line-height:1;
}
.sticker:not(.primary) .icon{background:var(--accent-ink); color:var(--accent)}
.primary .icon{background:var(--accent-ink); color:var(--accent)}
.sticker:not(.primary) .icon{background:var(--gold-soft); color:var(--gold)}
.icon svg{width:1.6rem; height:1.6rem}
.txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:.1rem}
.txt strong{font-family:var(--serif); font-weight:400; font-size:1.35rem; line-height:1.15}
.txt small{font-size:.9rem; opacity:.82}
.arrow{flex:none; font-size:1.4rem; transition:transform .2s ease}
.sticker:hover .arrow{transform:translateX(4px) rotate(-8deg)}
.tag{
  position:absolute; top:-.75rem; right:1.1rem;
  font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  background:var(--gold); color:var(--surface); padding:.2rem .65rem; border-radius:999px;
  transform:rotate(4deg);
}

footer{position:relative; z-index:1; color:var(--muted); font-size:.85rem; padding-block:1rem 1.75rem; text-align:center}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}
</style>
</head>

<script>
(function(){
  /* Luzes roxas suaves passeando pelo fundo todo, todas no mesmo ritmo */
  const DUR = 9;
  const sky = document.getElementById("sky");
  const rnd = (a, b) => a + Math.random() * (b - a);
  const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const roxos = ["180,143,224", "142,79,209", "122,63,192", "91,42,134", "200,165,240", "110,60,200"];
  const formas = [
    { w: 50, h: 28, r: () => "50%" },
    { w: 75, h: 10, r: () => "999px" },
    { w: 34, h: 44, r: () => `${rnd(42,58)}% ${rnd(42,58)}% ${rnd(42,58)}% ${rnd(42,58)}% / ${rnd(42,58)}% ${rnd(42,58)}% ${rnd(42,58)}% ${rnd(42,58)}%` },
    { w: 30, h: 30, r: () => "50%", anel: true },
    { w: 46, h: 22, r: () => `${rnd(40,60)}% ${rnd(40,60)}% ${rnd(40,60)}% ${rnd(40,60)}%` },
    { w: 14, h: 55, r: () => "999px" },
    { w: 30, h: 30, r: () => `${rnd(42,58)}% ${rnd(42,58)}% ${rnd(42,58)}% ${rnd(42,58)}%` }
  ];
  const pos = f => `translate(calc(${rnd(-5, 105)}vw - ${f.w / 2}vmax), calc(${rnd(0, 100)}vh - ${f.h / 2}vmax))`;
  function mover(el, f){
    const dur = DUR;
    el.style.transitionDuration = dur + "s";
    el.style.transform = `${pos(f)} rotate(${rnd(-60, 60)}deg) scale(${rnd(.8, 1.3)}, ${rnd(.8, 1.3)})`;
    el.style.borderRadius = f.r();
    el.style.opacity = .5;
    if(!parado) setTimeout(() => mover(el, f), dur * 1000);
  }
  formas.forEach((f, i) => {
    const el = document.createElement("div"); el.className = "light";
    const c = roxos[i % roxos.length];
    el.style.width = f.w + "vmax"; el.style.height = f.h + "vmax";
    el.style.background = f.anel
      ? `radial-gradient(closest-side, transparent 30%, rgba(${c},.35) 60%, transparent 95%)`
      : `radial-gradient(closest-side, rgba(${c},.45), rgba(${c},.18) 55%, transparent)`;
    el.style.transitionDuration = "0s";
    el.style.transform = pos(f); el.style.borderRadius = f.r(); el.style.opacity = .5;
    sky.appendChild(el);
    if(!parado) requestAnimationFrame(() => requestAnimationFrame(() => mover(el, f)));
  });

})();
</script>
